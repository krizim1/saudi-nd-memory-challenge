# Builds the game and publishes it to GitHub Pages.
#
# A Pages project site is served from `https://<user>.github.io/<repo>/`
# rather than a domain root, so the build needs that sub-path. It is
# derived from GITHUB_REPOSITORY at build time: renaming the repository
# changes the deployed URL with no edit here, and nothing in the app
# hardcodes it either.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push supersedes an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc -b

      - name: Test
        run: npm test

      - name: Build
        # ${GITHUB_REPOSITORY#*/} strips the owner, leaving the repo name.
        run: npx vite build --base="/${GITHUB_REPOSITORY#*/}/"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
